# F.E.D.O. HUB — отдельный server-блок.
# Не изменяет конфигурацию других проектов (GGSELL и т.п.).
# TLS-сертификаты выпускаются отдельно (certbot) для своего домена.
upstream fedo_hub {
    server 127.0.0.1:8765;
    keepalive 16;
}

server {
    listen 80;
    server_name fedo.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fedo.example.com;

    ssl_certificate     /etc/letsencrypt/live/fedo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fedo.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://fedo_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        # стриминг AI-ответов (SSE)
        proxy_buffering off;
        proxy_cache off;
    }

    location = /api/health {
        proxy_pass http://fedo_hub;
        access_log off;
    }

    # Статика Desktop-сборки не требуется на HUB: HUB — только API.
    location / {
        return 404;
    }
}
